name: Probe concert sources

on:
  workflow_dispatch: {}
  push:
    branches: [claude/cultural-curator-agent-qb7x8o]
    paths: [.github/workflows/probe-concert-sources.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch raw pages
        run: |
          set -x
          mkdir -p raw
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          fetch() {
            url="$1"
            out="$2"
            code=$(curl -sS -L -A "$UA" -o "raw/$out" -w "%{http_code}" "$url" || echo "CURLERR")
            bytes=$(wc -c < "raw/$out" 2>/dev/null || echo 0)
            echo "RESULT $url -> http=$code bytes=$bytes file=$out"
          }

          fetch "https://zwaremetalen.com/concertagenda" "zwaremetalen_agenda.html"
          fetch "https://www.metalfan.nl/agenda.php" "metalfan_agenda.html"
          fetch "https://www.metalagenda.nl/venues/de-helling" "metalagenda_de-helling.html"
          fetch "https://www.metalagenda.nl/venues/neushoorn" "metalagenda_neushoorn.html"

      - name: Strip tags to readable text (block-per-line)
        run: |
          mkdir -p text
          python3 - <<'PY'
          import re, glob, os
          from html.parser import HTMLParser

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.lines = []
                  self.buf = ""
              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style", "noscript"):
                      self.skip += 1
                  if tag in ("br", "p", "div", "li", "tr", "h1", "h2", "h3", "h4", "td", "article", "section"):
                      self._flush()
              def handle_endtag(self, tag):
                  if tag in ("script", "style", "noscript"):
                      self.skip = max(0, self.skip - 1)
                  if tag in ("p", "div", "li", "tr", "h1", "h2", "h3", "h4", "td", "article", "section"):
                      self._flush()
              def handle_data(self, data):
                  if self.skip:
                      return
                  self.buf += data
              def _flush(self):
                  t = re.sub(r"\s+", " ", self.buf).strip()
                  if t:
                      self.lines.append(t)
                  self.buf = ""
              def result(self):
                  self._flush()
                  return self.lines

          for path in glob.glob("raw/*.html"):
              with open(path, encoding="utf-8", errors="replace") as f:
                  html = f.read()
              p = TextExtractor()
              p.feed(html)
              lines = p.result()
              # dedupe consecutive identical lines
              out = []
              for l in lines:
                  if not out or out[-1] != l:
                      out.append(l)
              name = os.path.splitext(os.path.basename(path))[0]
              with open(f"text/{name}.txt", "w", encoding="utf-8") as f:
                  f.write("\n".join(out))
              print(f"{path}: {len(html)} html chars -> {len(out)} text lines")
          PY

      - name: Print text excerpts
        run: |
          for f in text/*.txt; do
            echo "##### $f (first 250 lines) #####"
            head -n 250 "$f"
            echo
            echo "##### $f (lines matching date-like patterns, first 60) #####"
            grep -Ei '\b(jan|feb|mrt|maart|apr|mei|jun|jul|aug|sep|okt|nov|dec)[a-z]*\b.{0,20}202[5-9]|202[5-9].{0,20}\b(jan|feb|mrt|maart|apr|mei|jun|jul|aug|sep|okt|nov|dec)' "$f" | head -n 60
            echo
          done

      - name: Print raw HTML context around first date hits (for DOM structure)
        run: |
          for f in raw/zwaremetalen_agenda.html raw/metalagenda_de-helling.html raw/metalagenda_neushoorn.html; do
            echo "##### RAW CONTEXT: $f #####"
            grep -n -m 3 -Ei '202[5-9]' "$f" | head -3 | cut -d: -f1 | while read -r ln; do
              start=$((ln>15 ? ln-15 : 1))
              end=$((ln+15))
              echo "--- lines $start-$end ---"
              sed -n "${start},${end}p" "$f"
              echo
            done
          done

      - name: Upload raw HTML (backup)
        uses: actions/upload-artifact@v4
        with:
          name: raw-html
          path: |
            raw/
            text/
          retention-days: 3
